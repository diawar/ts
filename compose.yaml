name: tendersearch

x-app: &app
  image: tendersearch:local
  pull_policy: never
  environment: &environment
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Run scripts/setup_local.py first}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup_local.py first}
    POSTGRES_HOST: db
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
    AUTH_SITE_URL: ${AUTH_SITE_URL:-http://localhost:${WEB_PORT:-8000}}
    EMAIL_HOST: ${EMAIL_HOST:-mailpit}
    EMAIL_PORT: ${EMAIL_PORT:-1025}
    EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
    EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
    EMAIL_USE_TLS: ${EMAIL_USE_TLS:-0}
    EMAIL_USE_SSL: ${EMAIL_USE_SSL:-0}
    DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-TenderSearch <no-reply@tender-search.kz>}
    REDIS_URL: redis://redis:6379/0
    LEAD_COLLECTION_AVAILABLE: ${LEAD_COLLECTION_AVAILABLE:-0}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
    TELEGRAM_POLLING_ENABLED: ${TELEGRAM_POLLING_ENABLED:-true}
  volumes:
    - documents:/app/data
  init: true

services:
  # Local mail sink only. Real SMTP is configured with EMAIL_* variables.
  mailpit:
    image: axllent/mailpit@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped
    mem_limit: 128m

  auth-mailer:
    <<: *app
    command: [python, manage.py, send_auth_mail]
    depends_on:
      initialize:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 192m

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tender_search
      POSTGRES_USER: tender_search
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup_local.py first}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U tender_search -d tender_search"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory, 128mb, --maxmemory-policy, noeviction]
    volumes:
      - queue:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 256m

  initialize:
    <<: *app
    command: [python, manage.py, initialize]
    environment:
      <<: *environment
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:?Run scripts/setup_local.py first}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app
    build: .
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    depends_on:
      initialize:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    mem_limit: 512m

  worker:
    <<: *app
    command: [celery, -A, tender_search.web, worker, --loglevel=INFO, --concurrency=1, --max-tasks-per-child=50, -Q, celery, -n, background@%h]
    depends_on:
      initialize:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m

  search-worker:
    <<: *app
    command: [celery, -A, tender_search.web, worker, --loglevel=INFO, --concurrency=1, --max-tasks-per-child=50, -Q, interactive, -n, interactive@%h]
    depends_on:
      initialize:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m

  specification-worker:
    <<: *app
    command: [celery, -A, tender_search.web, worker, --loglevel=INFO, --concurrency=1, --max-tasks-per-child=50, -Q, specifications, -n, specifications@%h]
    depends_on:
      initialize:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m

  indexer:
    <<: *app
    command: [python, manage.py, index_procurements]
    depends_on:
      initialize:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 384m

  detail-indexer:
    <<: *app
    command: [python, manage.py, index_details]
    depends_on:
      initialize:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 384m

  collection-monitor:
    <<: *app
    command: [python, manage.py, monitor_collections]
    depends_on:
      initialize:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m

  medical-indexer:
    <<: *app
    command: [python, manage.py, index_medical]
    depends_on:
      initialize:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 384m

  coverage-monitor:
    <<: *app
    command: [python, manage.py, refresh_coverage]
    depends_on:
      initialize:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 192m

  lead-collector:
    <<: *app
    command: [python, manage.py, collect_leads]
    profiles: [leads]
    depends_on:
      initialize:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5

  telegram:
    <<: *app
    command: [python, manage.py, telegram_monitor]
    depends_on:
      initialize:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m

volumes:
  database:
  documents:
  queue:
